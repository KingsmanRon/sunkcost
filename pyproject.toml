# Virtual uv workspace root. Each member has its own pyproject.toml.
# Shared tool configuration (ruff, mypy, pytest) lives here.

[tool.uv.workspace]
members = [
    "packages/spec",
    "packages/sdk-python",
    "services/worker",
    "services/api",
    "bench",
    "adapters/langgraph",
    "adapters/openai-agents",
    "adapters/cycles",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
sunkcost = { workspace = true }
sunkcost-spec = { workspace = true }
sunkcost-worker = { workspace = true }
sunkcost-api = { workspace = true }

[dependency-groups]
dev = [
    "cryptography>=45",
    "hypothesis>=6.140",
    "jsonschema>=4.23",
    "mypy>=1.18",
    "pytest>=8.4",
    "regress>=2024.11.1",
    "rfc3339-validator>=0.1.4",
    "ruff>=0.13",
    "scipy-stubs>=1.16",
    "types-jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is documentation, not code to reformat (ruff would rewrite fenced Python blocks).
extend-exclude = ["**/node_modules", "**/.next", "supabase/.temp", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "N",   # naming
    "RUF", # ruff-specific
]

# Mathematical notation in docstrings and comments, as in features.v1.md.
allowed-confusables = ["−", "×", "÷", "σ", "μ", "Σ", "α", "δ", "τ", "–"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]
# Vector generators use seeded pseudo-random data on purpose.
"packages/spec/tools/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = [
    "sunkcost",
    "sunkcost_spec",
    "sunkcost_worker",
    "sunkcost_api",
    "sunkcost_bench",
    "sunkcost_langgraph",
    "sunkcost_openai_agents",
    "sunkcost_cycles",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# scikit-learn, threadpoolctl and runcycles ship no type information; everything else is strict.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "threadpoolctl", "runcycles", "runcycles.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "stats: G2b statistical simulation, run by make test-stats",
    "failure: G4 failure injection, run by make test-failure",
    "integration: G6 API and worker against a real local Supabase, run by make test-integration",
    "db: G5 isolation through PostgREST over HTTP, run by make test-db",
]
xfail_strict = true
