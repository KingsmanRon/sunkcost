# Virtual uv workspace root. Each member has its own pyproject.toml.
# Shared tool configuration (ruff, mypy, pytest) lives here.

[tool.uv.workspace]
members = ["packages/spec"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "cryptography>=45",
    "jsonschema>=4.23",
    "mypy>=1.18",
    "pytest>=8.4",
    "regress>=2024.11.1",
    "rfc3339-validator>=0.1.4",
    "ruff>=0.13",
    "types-jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is documentation, not code to reformat (ruff would rewrite fenced Python blocks).
extend-exclude = ["**/node_modules", "**/.next", "supabase/.temp", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "N",   # naming
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# Vector generators use seeded pseudo-random data on purpose.
"packages/spec/tools/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
xfail_strict = true
