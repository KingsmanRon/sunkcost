# Railway service "api" (ARCHITECTURE.md §11.2, docs/DEPLOYMENT.md). In the service's settings, set
# the config-as-code path to /services/api/railway.toml and leave the root directory at the repo
# root: the Dockerfile builds from there. Migrations never run here; GitHub Actions applies them.

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/api/Dockerfile"
watchPatterns = ["services/api/**", "packages/sdk-python/**", "packages/spec/**", "uv.lock"]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
