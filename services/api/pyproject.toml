[project]
name = "sunkcost-api"
version = "0.1.0"
description = "Sunkcost API: authentication, ingestion, outcomes, bundle serving, management endpoints."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "pyjwt[crypto]>=2.15",
    "prometheus-client>=0.26",
    "sunkcost",
    "sunkcost-spec",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunkcost_api"]
