[project]
name = "sunkcost-worker"
version = "0.1.0"
description = "Sunkcost worker: calibration, bundle signing, reports, drift monitoring, retention, webhooks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "httpx>=0.27",
    "numpy>=2.3",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "sunkcost",
    "sunkcost-spec",
    "threadpoolctl>=3.5",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunkcost_worker"]
