# gitleaks: the default rule set plus narrow, documented allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "RFC 8032 section 7.1 TEST 1 Ed25519 key pair (hex and base64 forms). It is published in the RFC, signs only test vectors and the local docker-compose stack, and no SDK trusts it by default."
regexes = [
  '''9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60''',
  '''d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a''',
  '''nWGxne/9WmC6hEr0kuwsxERJxWl7MmkZcDusAxyuf2A=''',
]
