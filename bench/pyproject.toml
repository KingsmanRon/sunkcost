[project]
name = "sunkcost-bench"
version = "0.1.0"
description = "Reproducible evaluation of Sunkcost calibration on public agent-trajectory datasets."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "sunkcost",
    "sunkcost-worker",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunkcost_bench"]
